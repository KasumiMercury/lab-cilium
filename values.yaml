# Cilium Helm values for the MicroK8s cluster built by lab-proxmox.
# Read by the Ansible bootstrap and by the ArgoCD Application; keep it the single source of truth.

# MicroK8s keeps CNI config and binaries under the snap data directory (required on MicroK8s)
cni:
  confPath: /var/snap/microk8s/current/args/cni-network
  binPath: /var/snap/microk8s/current/opt/cni/bin

# MicroK8s' containerd sets CILIUM_SOCK=$SNAP_DATA/var/run/cilium/cilium.sock, so cilium-cni looks for the
# agent there. Put the agent's run directory (socket included) at the same place (required on MicroK8s).
daemon:
  runPath: /var/snap/microk8s/current/var/run/cilium

# Attach socket load balancing to the host's cgroup2 root, which Ubuntu already mounts at /sys/fs/cgroup.
# The chart's default (/run/cilium/cgroupv2) reaches the agent only through a /var/run/cilium runPath; with the
# runPath above the agent would mount cgroup2 inside its own cgroup namespace, and host-network pods and the
# nodes themselves could not reach ClusterIPs (required on MicroK8s with the runPath above).
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

ipam:
  operator:
    # Must match --cluster-cidr in /var/snap/microk8s/current/args/kube-proxy (MicroK8s default 10.1.0.0/16).
    # The Ansible bootstrap asserts this before installing.
    clusterPoolIPv4PodCIDRList:
      - 10.1.0.0/16

# kube-proxy replacement. The Ansible bootstrap disables MicroK8s' kube-proxy on every node when this is true.
# 127.0.0.1:16443 reaches the API server from every node: kube-apiserver on control-plane nodes,
# the MicroK8s apiserver-proxy (traefik) on worker nodes. Cilium runs with hostNetwork, so localhost works.
kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 16443

operator:
  replicas: 1
  # Restart the operator when cilium-config changes (ArgoCD only updates the ConfigMap)
  rollOutPods: true
  # Metrics on :9963 are on by default; the dashboard goes with the agent's (see "Metrics" below)
  dashboards:
    enabled: true

# Restart the agents when cilium-config changes; most settings are only read at startup
rollOutCiliumPods: true

# Keep socket-level load balancing in the host namespace only. Without this, Pod connections to
# ClusterIPs bypass the netfilter rules of Tailscale proxies (LoadBalancer Services, the
# tailscale.com/expose annotation, Connectors). Can be changed on a running cluster; takes effect
# after the cilium agents restart (kubectl -n kube-system rollout restart ds/cilium).
# https://tailscale.com/kb/1236/kubernetes-operator (Cilium in kube-proxy replacement mode)
socketLB:
  hostNamespaceOnly: true

# Gateway API (GatewayClass "cilium"). Needs the CRDs pinned in gateway-api.yaml before the operator starts;
# Gateways get a LoadBalancer Service whose IP comes from Cilium LB IPAM (pool defined in the ArgoCD repo).
gatewayAPI:
  enabled: true

# Metrics. The agent (:9962), operator (:9963), Envoy (:9964) and Hubble (:9965) serve Prometheus metrics on
# host ports. The scrape configuration lives in the ArgoCD repo (PodMonitors): the chart's ServiceMonitors need
# the Prometheus Operator CRDs, which do not exist yet when the Ansible bootstrap installs Cilium.
# Dashboards are ConfigMaps labelled grafana_dashboard: "1" for the Grafana sidecar.
prometheus:
  enabled: true
  # Add the BPF syscall count/latency (off by default because every bpf() call is timed), used by the
  # "system calls" panels of the Cilium dashboard. The other BPF metrics are on by default.
  metrics:
    - +cilium_bpf_syscall_duration_seconds

# Emit cilium_bpf_map_pressure for every endpoint policy map, not only those more than 10% full (the default),
# so the BPF map pressure panel shows the policy maps too
bpf:
  policyMapPressureMetricsThreshold: 0

dashboards:
  enabled: true
  # The agent dashboard is larger than the 256 KiB last-applied-configuration annotation of client-side apply
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true

hubble:
  metrics:
    # labelsContext adds source/destination namespaces, used by the per-namespace Hubble dashboards
    enabled:
      - dns:labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - tcp:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - port-distribution:labelsContext=source_namespace,destination_namespace
      - icmp:labelsContext=source_namespace,destination_namespace
      # L7 HTTP metrics, only for traffic that a CiliumNetworkPolicy with HTTP rules sends through Envoy
      # (the visibility policies live in the ArgoCD repo). Labels match the "L7 HTTP metrics by workload" dashboard.
      - httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
    dashboards:
      enabled: true
